{{ block content }}
<div class="narrow-body">
    <h2>Round {{ round_number }} Results</h2>

    <ul>
        <li>The color of the ball in Box A was: <span class="{% if box_a_color == 'YELLOW' %}yellow-bold{% else %}blue-bold{% endif %}">{{ box_a_color }}</span></li>
        <li>{{ num_box_b }} players in your group chose Box B.</li>
        <li>Your Choice: Box {{ choice }}</li>
        <li>Your Earnings This Round: <b>{{ round_earnings }}</b> ECUs</li>
    </ul>

    <div class="next-button">{{ next_button }}</div>
</div>
{{ endblock }}
