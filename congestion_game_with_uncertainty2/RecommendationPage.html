{{ block title }}
Your Recommendation Ball
{{ endblock }}

{{ block content }}
<div style="max-width: 1200px; margin: 0 auto; padding: 40px 20px;">

    <!-- Big Recommendation Ball (Circle) -->
    <div style="text-align: center; margin: 60px 0;">
        <div style="display: inline-block; width: 400px; height: 400px; border: 4px solid #333; border-radius: 50%; background-color: #f5f5f5; display: flex; align-items: center; justify-content: center;">
            <div style="font-size: 200px; font-weight: bold; color: #333;">
                {{ recommendation }}
            </div>
        </div>
    </div>

    <!-- Text Below Ball -->
    <div style="text-align: center; margin: 40px 0;">
        <p style="font-size: 28px; font-weight: bold; color: #333; margin: 0;">
            Your Recommendation: <span style="font-weight: 900;">Choose Box {{ recommendation }}</span>
        </p>
    </div>

    <!-- Reminder Box -->
    <div style="background-color: #fff9e6; border-left: 4px solid #ffc107; padding: 20px 30px; margin: 40px auto; max-width: 800px;">
        <p style="font-size: 18px; margin: 0; color: #333;">
            <strong>Remember:</strong> This is only a recommendation. You can choose Box A or Box B on the next screen.
        </p>
    </div>

    <div style="text-align: right; margin-top: 40px;">
        {{ next_button }}
    </div>
</div>
{{ endblock }}
