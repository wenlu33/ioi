{{ block title }}
Drawing Ball for Box A
{{ endblock }}

{{ block content }}
<div style="max-width: 800px; margin: 0 auto; padding: 80px 20px; text-align: center;">


    <!-- Simple Ball Animation -->
    <div style="margin: 60px 0;">
        <div style="width: 120px; height: 120px; margin: 0 auto; border: 3px dashed #999; border-radius: 50%; display: flex; align-items: center; justify-content: center; animation: pulse 1.5s infinite;">
            <span style="font-size: 48px; color: #999;">?</span>
        </div>
    </div>

    <p style="font-size: 20px; color: #666; margin: 40px 0;">
        The computer is randomly selecting the color...<br>
        <strong style="color: #FFD700;">YELLOW</strong> or <strong style="color: #4169E1;">BLUE</strong>
    </p>

    <div style="background-color: #f8f9fa; padding: 20px; border-radius: 5px; margin: 40px 0;">
        <p style="font-size: 16px; color: #333; margin: 0;">
            You will not see the color until after you make your choice.
        </p>
    </div>

    <div style="text-align: right; margin-top: 60px;">
        {{ next_button }}
    </div>
</div>

<style>
@keyframes pulse {
    0%, 100% {
        transform: scale(1);
        opacity: 1;
    }
    50% {
        transform: scale(1.1);
        opacity: 0.7;
    }
}
</style>
{{ endblock }}
