{{ block style }}
<link rel="stylesheet" type="text/css" href="{{ static 'global/global_styles.css' }}"/>
{{ endblock }}

{{ block title }}
<div class="narrow-body">Part 2</div>
{{ endblock }}

{{ block content }}
<div class="narrow-body">
    <h1 style="text-align: center; margin-top: 60px;">Part 1 Complete!</h1>
    
    <div style="max-width: 600px; margin: 40px auto; padding: 30px; border-radius: 5px;">
        <p style="font-size: 20px; margin: 0;">
            You have completed Part 1 of the experiment.
        </p>
        <p style="font-size: 20px; margin-top: 20px;">
            <strong>Part 2</strong> will now begin. Please read the instructions carefully on the next page.
        </p>
    </div>
    
    <div class="next-button">{{ next_button }}</div>
</div>
{{ endblock }}
